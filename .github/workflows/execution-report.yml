name: Weekly Execution Report
on:
  schedule:
    - cron: "30 18 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python execution_observations.py
      - name: Publish report and preserve dated weekly copy
        run: |
          mkdir -p reports/execution
          cp execution_report.json "reports/execution/$(date -u +%F).json"
          cp EXECUTION_REPORT.md "reports/execution/$(date -u +%F).md"
          cat EXECUTION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          git add execution_checks.csv execution_report.json EXECUTION_REPORT.md reports/execution
          git diff --cached --quiet || git commit -m "weekly execution report $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
