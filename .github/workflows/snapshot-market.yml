name: Snapshot MMA Market
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The rebase before pushing needs a merge base, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # This job writes to the official ledger, so it runs the same full suite
      # as the routine card update rather than the pricing tests alone.
      - name: Verify code before changing generated artifacts
        run: |
          python -m py_compile *.py
          python -m unittest discover -s tests
      - name: Capture consensus and every paired book quote
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py --require-key
      - name: Refresh card and lock any qualifying trades
        run: python predict_card.py --lock-paper-trades
      - name: Validate forward paper ledger
        run: python validate_paper.py
      # H22 replicated out of sample at the same size and failed only on
      # sample: 166 bets cannot resolve a four-point edge. The holdout is
      # spent, so the only remaining route to an answer is forward. This logs
      # what the rule would bet, from a snapshot taken before the fight, and
      # never rewrites a bet once written.
      - name: Log H22 forward paper bets
        run: python forward_test.py log
      # A fight clearing the edge rule used to happen silently; only broken
      # workflows sent mail. Runs before the commit so the de-dupe log is
      # committed with the trade that produced it.
      - name: Announce newly locked paper trades
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: python notify_card.py
      - name: Commit market snapshot
        run: |
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          git add docs/ odds_upcoming.csv odds_log.csv prediction_snapshots.csv \
            paper_trades.csv paper_validation.json h22_forward_log.csv \
            notified_trades.csv \
            model_manifest.json market_snapshot_manifest.json data/market_quotes
          git diff --cached --quiet || git commit -m "market snapshot $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
      - name: Email failure notification
        if: failure()
        env:
          # Whichever is set wins, Resend first. Unset secrets arrive blank
          # and are treated as absent, so adding one is the whole migration -
          # nothing needs removing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: >
          python notify_email.py
          "claude-fights market snapshot failed"
          "The Snapshot MMA Market workflow failed before publishing fresh prices. Check the GitHub Actions run for details."
