name: Archive Historical Odds

# Chunked, resumable backfill of per-book pre-fight prices. The key stays in
# the secret store and never reaches a log or a command line. Each run spends
# at most `max_requests` x 10 credits and commits its manifest, so the next
# run resumes where this one stopped rather than paying twice for a snapshot.
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Max historical requests this run (x10 credits each; 0 spends nothing)"
        required: true
        default: "0"
      regions:
        description: "Regions, comma separated. Each region is billed separately."
        required: false
        default: "us"
      start:
        description: "Earliest card date to backfill"
        required: false
        default: "2020-06-06"

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Show what this run would cost before spending it
        run: |
          python historical_odds.py --dry-run \
            --regions "${{ inputs.regions }}" --start "${{ inputs.start }}"
      - name: Backfill
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python historical_odds.py \
            --max-requests "${{ inputs.max_requests }}" \
            --regions "${{ inputs.regions }}" \
            --start "${{ inputs.start }}"
      - name: Commit archive progress
        run: |
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          git add raw/odds_api_historical || true
          git diff --cached --quiet || git commit -m "archive odds backfill $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
