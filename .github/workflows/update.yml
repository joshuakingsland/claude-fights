name: Update Fight Ledger
on:
  schedule:
    - cron: "0 14 * * 0,1,3"  # Sun/Mon snapshots + results; Wed official lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rebase before pushing needs a merge base, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify code before changing generated artifacts
        run: |
          python -m py_compile *.py
          python -m unittest discover -s tests
      - name: Refresh fight results
        run: python update_data.py
      - name: Fail closed when tracked completed fights are missing
        run: python freshness.py --require-current
      - name: Settle prior official paper trades
        run: python paper_ledger.py settle
      - name: Fetch upcoming odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py --require-key
      - name: Snapshot card and lock any qualifying trades
        run: python predict_card.py --lock-paper-trades
      - name: Validate forward paper ledger
        run: python validate_paper.py
      - name: Monitor drift when validation data is present
        run: |
          if [ -f production_validation.csv ]; then python monitor_drift.py; fi
      - name: Audit staking gates when validation data is present
        run: |
          if [ -f production_validation.csv ] && [ -f historical_entry_validation.csv ]; then python validate_staking.py; fi
      # A fight clearing the edge rule used to happen silently; only broken
      # workflows sent mail. Runs before the commit so the de-dupe log is
      # committed with the trade that produced it.
      - name: Announce newly locked paper trades
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: python notify_card.py
      - name: Commit generated artifacts
        run: |
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          git add docs/ fights_v2.csv odds_upcoming.csv prediction_snapshots.csv \
            paper_trades.csv paper_settlements.csv paper_validation.json \
            model_manifest.json data_source_manifest.json data_freshness.json
          if [ -f odds_log.csv ]; then git add odds_log.csv; fi
          if [ -f notified_trades.csv ]; then git add notified_trades.csv; fi
          if [ -f h22_forward_log.csv ]; then git add h22_forward_log.csv; fi
          if [ -d data/market_quotes ]; then git add data/market_quotes; fi
          if [ -f market_snapshot_manifest.json ]; then git add market_snapshot_manifest.json; fi
          if [ -f drift_report.json ]; then git add drift_report.json; fi
          if [ -f staking_validation.json ]; then git add staking_validation.json; fi
          git diff --cached --quiet || git commit -m "auto-update $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
      - name: Email failure notification
        if: failure()
        env:
          # Whichever is set wins, Resend first. Unset secrets arrive blank
          # and are treated as absent, so adding one is the whole migration -
          # nothing needs removing.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: >
          python notify_email.py
          "claude-fights update workflow failed"
          "The Update Fight Ledger workflow failed before publishing fresh outputs. Check the GitHub Actions run for details."
