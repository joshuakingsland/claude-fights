name: Refresh Canonical Validation
on:
  schedule:
    - cron: "0 16 1 * *"  # monthly; intentionally separate from card updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # The rebase before pushing needs a merge base, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run exact production audit
        run: python validate_production.py --start 2019-01-01
      # The method and rounds models are what price the prop and totals
      # columns on the card. Both had a validator and neither ran anywhere, so
      # a regression in either would have shipped silently to the site.
      - name: Validate method probabilities
        run: python validate_method.py
      - name: Validate totals and distance probabilities
        run: python validate_rounds.py
      - name: Commit validation artifacts
        run: |
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          git add production_validation.csv production_validation.json model_manifest.json
          git add method_validation.json rounds_validation.json
          git diff --cached --quiet || git commit -m "validation refresh $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push
