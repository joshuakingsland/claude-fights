name: Capture Standardized T-30 Odds

on:
  schedule:
    - cron: "17,47 10-23 * * 6"
    - cron: "17,47 0-8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fight-ledger-write
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The rebase before pushing needs a merge base, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Poll free event metadata, then capture only due fights
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python capture_close.py
      - name: Commit new close snapshots
        run: |
          git config user.name "fight-ledger-bot"
          git config user.email "actions@github.com"
          if [ -f close_snapshots.csv ]; then git add close_snapshots.csv; fi
          git diff --cached --quiet || git commit -m "capture standardized pre-fight odds"
          git pull --rebase --autostash origin main
          git push
      - name: Email failure notification
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: >
          python notify_email.py
          "claude-fights capture workflow failed"
          "The Capture Standardized T-30 Odds workflow failed. Check the GitHub Actions run for details."
