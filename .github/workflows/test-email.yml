name: Test email notification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/test-email-notification
    paths:
      - .github/workflows/test-email.yml

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          required = ("GMAIL_USERNAME", "GMAIL_APP_PASSWORD", "MAIL_TO")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError("Missing required GitHub Actions secrets: " + ", ".join(missing))

          message = EmailMessage()
          message["Subject"] = "claude-fights GitHub Actions email test"
          message["From"] = os.environ["GMAIL_USERNAME"]
          message["To"] = os.environ["MAIL_TO"]
          message.set_content(
              "Success: Gmail SMTP authentication from GitHub Actions is working."
          )

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(
                  os.environ["GMAIL_USERNAME"],
                  os.environ["GMAIL_APP_PASSWORD"],
              )
              smtp.send_message(message)
          PY
