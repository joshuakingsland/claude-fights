name: Test email notification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/test-email-notification
    paths:
      - .github/workflows/test-email.yml

permissions:
  contents: read

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          required = (
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USER",
              "SMTP_PASSWORD",
              "BET_EMAIL_TO",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise RuntimeError(
                  "Missing required GitHub Actions secrets: " + ", ".join(missing)
              )

          message = EmailMessage()
          message["Subject"] = "claude-fights GitHub Actions email test"
          message["From"] = os.environ["SMTP_USER"]
          message["To"] = os.environ["BET_EMAIL_TO"]
          message.set_content(
              "Success: Gmail SMTP authentication from GitHub Actions is working."
          )

          with smtplib.SMTP(
              os.environ["SMTP_HOST"],
              int(os.environ["SMTP_PORT"]),
              timeout=30,
          ) as smtp:
              smtp.starttls()
              smtp.login(
                  os.environ["SMTP_USER"],
                  os.environ["SMTP_PASSWORD"],
              )
              smtp.send_message(message)
          PY
